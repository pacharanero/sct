# R62 guideline-derived semantic-search benchmark corpus.
#
# 67 cases across 47 concepts. Every expected SCTID was validated against a real
# UK Monolith 42.4.0 database (exists, active, preferred term confirmed). Sources:
#
#   - NHS England, Quality and Outcomes Framework guidance for 2025/26
#     (https://www.england.nhs.uk/publication/quality-and-outcomes-framework-guidance-for-2025-26/)
#     and the QOF results site (https://qof.digital.nhs.uk). Domain-level citations
#     below; epilepsy is a disease register only in 2025/26 (no indicators).
#   - Common UK general-practice documentation queries (maintainer-reviewed).
#
# Concept identifiers and expected outcomes only; no guideline text is reproduced.

