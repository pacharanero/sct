name: Auto-tag on version bump

# When a push to main bumps the version in Cargo.toml, create and push the
# matching `v<version>` tag, then invoke the release and Python wheel workflows
# with that tag. The final PyPI upload stays in this top-level workflow because
# PyPI Trusted Publishing does not accept a reusable workflow as the publisher.
#
# We invoke release.yml via `workflow_call` rather than relying on the tag
# push to trigger it, because pushes performed via the default GITHUB_TOKEN
# do not trigger downstream workflows (anti-recursion safeguard). Manual
# tag pushes from a developer's terminal still trigger release.yml via its
# `push: tags` trigger; both paths converge on the same release pipeline.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag whose Python wheels should be published, e.g. v0.20.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    name: Detect version bump and create tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      bumped: ${{ steps.bump.outputs.bumped }}
      publish_python: ${{ steps.bump.outputs.publish_python }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the previous commit to diff Cargo.toml against.
          fetch-depth: 2
          persist-credentials: false

      - name: Detect Cargo.toml version change
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must have the form vX.Y.Z"
              exit 1
            fi
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$INPUT_TAG" --silent >/dev/null; then
              echo "::error::Tag $INPUT_TAG does not exist"
              exit 1
            fi
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "publish_python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
          old=$(git show HEAD~1:Cargo.toml 2>/dev/null \
                  | grep -m1 '^version = "' | cut -d'"' -f2 || echo "")
          python_version=$(grep -m1 '^version = "' python/Cargo.toml | cut -d'"' -f2)

          if [ -z "$new" ]; then
            echo "::warning::Could not read version from Cargo.toml"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "publish_python=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$new" != "$python_version" ]; then
            echo "::error::Cargo.toml version $new does not match python/Cargo.toml version $python_version"
            exit 1
          fi
          if [ "$new" = "$old" ]; then
            echo "No version change ($new == $old) - nothing to tag."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "publish_python=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$new"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent >/dev/null 2>&1; then
            echo "Tag $tag already exists - assuming a previous run created it."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "publish_python=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Cargo.toml: $old → $new"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "publish_python=true" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          tag_object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" \
            -f message="Release $TAG" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$tag_object" \
            --silent

  release:
    # Run the matrix build, GitHub Release, crates.io publish, and tap/bucket
    # updates from release.yml against the freshly-pushed tag. Using
    # workflow_call sidesteps the GITHUB_TOKEN anti-recursion rule.
    needs: tag
    if: needs.tag.outputs.bumped == 'true'
    permissions:
      actions: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets:
      DOCKER_HUB_PAT: ${{ secrets.DOCKER_HUB_PAT }}
      TAP_REPOS_TOKEN: ${{ secrets.TAP_REPOS_TOKEN }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  python-wheels:
    needs: tag
    if: needs.tag.outputs.publish_python == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-python.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  publish-python:
    name: Publish Python package to PyPI
    needs: [tag, release, python-wheels]
    if: >-
      always() &&
      needs.tag.outputs.publish_python == 'true' &&
      needs.python-wheels.result == 'success' &&
      (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          path: release-source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: python-wheel-*
          merge-multiple: true
      - name: Validate release wheels
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: python python/verify-wheel.py --project-root release-source --tag "$TAG" --release dist/*.whl
      - name: Publish wheels with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
