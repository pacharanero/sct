name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy (serve feature)
        run: cargo clippy --features serve --all-targets -- -D warnings

      - name: cargo clippy (dmwb feature)
        run: cargo clippy --features dmwb --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo test (serve feature)
        run: cargo test --features serve

      - name: cargo check (downstream SDK without default features)
        run: cargo check --manifest-path tests/downstream-sdk/Cargo.toml --locked
        env:
          CARGO_TARGET_DIR: target/downstream-sdk

      - name: Install FHIR conformance tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq sqlite3 curl

      - name: FHIR conformance gate (sct serve vs committed RF2 fixture)
        run: |
          cargo build --bin sct
          SCT_BIN=target/debug/sct benchmarks/conformance-ci.sh

  # The release matrix builds Windows, but the test job above is Linux-only -
  # a Windows-only compile break (e.g. a dependency accidentally scoped to
  # [target.'cfg(unix)'], which shipped broken in v0.17.0) would otherwise
  # surface for the first time inside the release pipeline. cargo check
  # compiles the same graph as the release build without codegen.
  windows-check:
    name: Windows check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-

      - name: cargo check (default features, mirrors the release build)
        run: cargo check

      - name: cargo check --features full
        run: cargo check --features full

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python build tools
        run: python -m pip install maturin==1.14.1

      - name: Lint the binding crate
        run: cargo clippy --manifest-path python/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build synthetic test database
        run: |
          cargo run --quiet -- ndjson --rf2 tests/fixtures/rf2/SnomedCT_SyntheticTest_PRODUCTION_20260101T120000Z --refsets simple --output "$RUNNER_TEMP/synthetic.ndjson"
          cargo run --quiet -- sqlite --ndjson "$RUNNER_TEMP/synthetic.ndjson" --output "$RUNNER_TEMP/synthetic.db" --transitive-closure

      - name: Build the ABI3 wheel
        run: maturin build --manifest-path python/Cargo.toml --locked --out "$RUNNER_TEMP/wheels"

      - name: Validate wheel contents and version alignment
        run: python python/verify-wheel.py "$RUNNER_TEMP"/wheels/*.whl

      - name: Upload wheel and synthetic database
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-compatibility-fixture
          path: |
            ${{ runner.temp }}/wheels/*.whl
            ${{ runner.temp }}/synthetic.db
          if-no-files-found: error

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    needs: python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-compatibility-fixture
          path: ${{ runner.temp }}/python-compatibility
      - name: Install wheel and runtime test tools
        run: python -m pip install pytest==8.4.2 "$RUNNER_TEMP"/python-compatibility/wheels/*.whl
      - name: Test the installed Python package
        env:
          SCT_PYTHON_TEST_DB: ${{ runner.temp }}/python-compatibility/synthetic.db
        run: python -m pytest python/tests -q
      - name: Type-check the documented API for Python 3.9-3.14
        if: matrix.python-version == '3.13'
        run: |
          # mypy 2.x no longer targets Python 3.9; 1.20.2 is the latest line
          # that can verify the package's declared minimum Python version.
          python -m pip install mypy==1.20.2
          for version in 3.9 3.10 3.11 3.12 3.13 3.14; do
            python -m mypy --strict --python-version "$version" python/tests/typecheck-example.py
          done

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Coverage is report-only: a blind-spot finder, not a quality gate (no
  # --fail-under). cargo-llvm-cov is used deliberately over tarpaulin because the
  # assert_cmd suites (tests/cli.rs, trud_api.rs, embed_semantic.rs, snapshots.rs)
  # drive `sct` as a subprocess - llvm-cov builds that binary instrumented and
  # inherits LLVM_PROFILE_FILE into the child, so subprocess coverage is counted;
  # tarpaulin would miss it. The report uploads as an artifact and a per-file
  # table is written to the job summary so thin spots are visible at a glance.
  coverage:
    name: Coverage (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-llvm-cov@0.8.7

      # --features full measures the gated code (serve/gui/dmwb/tui/diagram-svg),
      # not just the default build. Run once with --no-report, then render.
      - name: Run the suite under coverage instrumentation
        run: cargo llvm-cov --no-report --features full

      - name: Generate lcov + HTML reports
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html

      - name: Write per-file coverage table to the job summary
        run: |
          {
            echo '## Coverage (report-only - a blind-spot finder, not a quality gate)'
            echo
            echo '```'
            cargo llvm-cov report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report (lcov + HTML)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/html
          if-no-files-found: error

  docs-nav:
    name: Docs nav
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A page missing from the nav still builds, and `zensical build` reports
      # no issue - it is simply unreachable except by guessing its URL. Runs
      # here rather than in the docs workflow because that only fires on main,
      # and this needs to block the pull request that introduces the orphan.
      - name: Check every docs page is reachable from the nav
        run: s/check-docs-nav

  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: zizmor@1.27.0
          fallback: none
      - run: zizmor --strict-collection .
        env:
          GH_TOKEN: ${{ github.token }}
