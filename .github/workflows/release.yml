name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.3.11"
        required: true
        type: string
    secrets:
      DOCKER_HUB_PAT:
        required: true
      TAP_REPOS_TOKEN:
        required: true
      AUR_SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: sct
            archive: sct-linux-x86_64.tar.gz
            deb: sct-linux-x86_64.deb
            rpm: sct-linux-x86_64.rpm
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: sct
            archive: sct-linux-aarch64.tar.gz
            deb: sct-linux-aarch64.deb
            rpm: sct-linux-aarch64.rpm
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: sct
            archive: sct-macos-aarch64.tar.gz
            dmg: sct-macos-aarch64.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: sct
            archive: sct-macos-x86_64.tar.gz
            dmg: sct-macos-x86_64.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: sct.exe
            archive: sct-windows-x86_64.zip
            exe: sct-windows-x86_64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install musl tools (Linux musl targets only)
        if: endsWith(matrix.target, '-unknown-linux-musl')
        run: sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # `rust-toolchain.toml` pins the channel, and the action above does not set
      # RUSTUP_TOOLCHAIN, so cargo runs on the pinned toolchain rather than the
      # `stable` the action installed - and `targets:` above added the target to
      # `stable`, not to the pinned one. Cross-compiling then fails with
      # "can't find crate for `core`". `rustup target add` honours the pin, so
      # this adds the target where cargo will actually look for it. CI never
      # catches this because CI only ever builds for the host target.
      - name: Add the cross-compilation target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist out
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          tar -czf out/${{ matrix.archive }} -C dist ${{ matrix.binary }}

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/"
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "out/${{ matrix.archive }}"

      # Linux: .deb (Debian/Ubuntu) and .rpm (Fedora/RHEL/openSUSE). Built from
      # the already-compiled static musl binary; metadata lives in Cargo.toml.
      - name: Install packaging tools (Linux)
        if: matrix.deb != ''
        run: cargo install --locked cargo-deb@3.7.0 cargo-generate-rpm@0.21.0

      - name: Build .deb and .rpm (Linux)
        if: matrix.deb != ''
        run: |
          cargo deb --no-build --target ${{ matrix.target }} --output out/${{ matrix.deb }}
          cargo generate-rpm --target ${{ matrix.target }} --output out/${{ matrix.rpm }}

      # macOS: an (unsigned) .dmg disk image holding the binary + README + LICENSE.
      - name: Build .dmg (macOS)
        if: matrix.dmg != ''
        run: |
          mkdir -p dmgroot
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dmgroot/
          cp README.md LICENSE dmgroot/
          hdiutil create -volname sct -srcfolder dmgroot -ov -format UDZO out/${{ matrix.dmg }}

      # Windows: the bare (unsigned) .exe alongside the .zip, for direct download.
      - name: Stage .exe (Windows)
        if: matrix.exe != ''
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "out/${{ matrix.exe }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          find . -type f \( \
              -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \
              -o -name '*.rpm' -o -name '*.dmg' -o -name '*.exe' \
            \) -print0 \
            | xargs -0 sha256sum \
            | sed 's|\./[^/]*/||' \
            > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mapfile -d '' files < <(find artifacts -type f \( \
            -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.dmg' -o -name '*.exe' \
          \) -print0)
          files+=(SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --generate-notes --verify-tag
          fi

  build-docker:
    name: Build Docker image (${{ matrix.platform }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # Native per-arch runners (rather than QEMU emulation on one runner):
      # cargo build --release inside the Dockerfile compiles at native speed
      # on each architecture, which matters a lot more for a Rust build than
      # for most Dockerfiles. This repo's binary-release matrix already
      # proves ubuntu-24.04-arm works the same way.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: pacharanero
          password: ${{ secrets.DOCKER_HUB_PAT }}

      # Pushes a digest-only, untagged image; the publish-docker job below
      # merges each arch's digest into the final multi-arch tags. Building
      # each platform to its own digest (rather than building both platforms
      # in one buildx call) is what lets each run on its native architecture.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=docker.io/pacharanero/sct,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: $DIGEST" >&2
            exit 1
          fi
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error

  publish-docker:
    name: Publish multi-arch Docker Hub manifest
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: pacharanero
          password: ${{ secrets.DOCKER_HUB_PAT }}

      # vX.Y.Z (exact), X.Y (floating minor), and latest - all pointing at
      # this release. Explicit tag is needed when invoked via workflow_call,
      # where github.ref points at the caller's branch rather than the tag.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/pacharanero/sct
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            if [[ "$tag" != docker.io/pacharanero/sct:* ]]; then
              echo "Unexpected Docker tag: $tag" >&2
              exit 1
            fi
            tag_args+=(-t "$tag")
          done

          image_refs=()
          for digest in *; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid image digest filename: $digest" >&2
              exit 1
            fi
            image_refs+=("docker.io/pacharanero/sct@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${image_refs[@]}"

      - name: Verify manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "docker.io/pacharanero/sct:$VERSION"

  # Mirror the finished multi-arch image to GitHub Container Registry as a
  # second home. GHCR pulls are not rate-limited the way anonymous Docker Hub
  # pulls are (a real problem for CI runners / clusters behind a shared IP), it
  # sits next to the source, and it authenticates with the built-in
  # GITHUB_TOKEN - no extra secret. This job is purely additive: it copies the
  # already-published tags and never touches the Docker Hub jobs above, so a
  # GHCR hiccup cannot break the Docker Hub release.
  #
  # NOTE: a newly-created GHCR package is private; flip it to public once in the
  # repo's package settings for anonymous `docker pull ghcr.io/pacharanero/sct`.
  publish-ghcr:
    name: Mirror the multi-arch image to GHCR
    needs: publish-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same tag set as the Docker Hub manifest, but for the GHCR image.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/pacharanero/sct
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest

      # Registry-to-registry copy of the multi-arch manifest (and its blobs)
      # from Docker Hub into GHCR under the same tags - no rebuild.
      - name: Mirror manifest from Docker Hub to GHCR
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          src="docker.io/pacharanero/sct:$VERSION"
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            if [[ "$tag" != ghcr.io/pacharanero/sct:* ]]; then
              echo "Unexpected GHCR tag: $tag" >&2
              exit 1
            fi
            tag_args+=(-t "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" "$src"

      - name: Verify manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "ghcr.io/pacharanero/sct:$VERSION"

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        # --allow-dirty: `cargo publish` regenerates Cargo.lock when checking the
        # index; in a clean CI checkout the only resulting "dirt" is that synced
        # lockfile, which is correct to ship. Prevents a stale-lock publish abort.
        run: cargo publish --no-verify --allow-dirty

  update-taps:
    name: Update Homebrew tap and Scoop bucket
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Extract version from tag
        id: vars
        env:
          # `inputs.tag` set when invoked via workflow_call; otherwise we
          # were triggered by a tag push and GITHUB_REF_NAME holds the tag.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"   # e.g. v0.3.11
          version="${tag#v}"                      # e.g. 0.3.11
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch SHA256SUMS from the published release
        id: sums
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          curl -fsSL \
            "https://github.com/$REPOSITORY/releases/download/$TAG/SHA256SUMS" \
            -o SHA256SUMS
          cat SHA256SUMS

          checksum() {
            local filename="$1"
            local value
            value="$(awk -v filename="$filename" '$2 == filename { print $1 }' SHA256SUMS)"
            if [[ ! "$value" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Missing or invalid checksum for $filename" >&2
              exit 1
            fi
            printf '%s' "$value"
          }

          {
            echo "linux_x86_64=$(checksum sct-linux-x86_64.tar.gz)"
            echo "linux_aarch64=$(checksum sct-linux-aarch64.tar.gz)"
            echo "macos_x86_64=$(checksum sct-macos-x86_64.tar.gz)"
            echo "macos_aarch64=$(checksum sct-macos-aarch64.tar.gz)"
            echo "windows_x86_64=$(checksum sct-windows-x86_64.zip)"
          } >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap (pacharanero/homebrew-tap)
        env:
          GH_TOKEN: ${{ secrets.TAP_REPOS_TOKEN }}
          LINUX_AARCH64: ${{ steps.sums.outputs.linux_aarch64 }}
          LINUX_X86_64: ${{ steps.sums.outputs.linux_x86_64 }}
          MACOS_AARCH64: ${{ steps.sums.outputs.macos_aarch64 }}
          MACOS_X86_64: ${{ steps.sums.outputs.macos_x86_64 }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -eu
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/pacharanero/homebrew-tap.git" tap
          cd tap

          cat > Formula/sct.rb <<EOF
          class Sct < Formula
            desc "Local-first SNOMED CT toolchain: RF2 → NDJSON, SQLite, Parquet, embeddings, MCP server"
            homepage "https://github.com/pacharanero/sct"
            version "$VERSION"
            license "AGPL-3.0-or-later"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/pacharanero/sct/releases/download/v#{version}/sct-macos-aarch64.tar.gz"
                sha256 "$MACOS_AARCH64"
              else
                url "https://github.com/pacharanero/sct/releases/download/v#{version}/sct-macos-x86_64.tar.gz"
                sha256 "$MACOS_X86_64"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/pacharanero/sct/releases/download/v#{version}/sct-linux-aarch64.tar.gz"
                sha256 "$LINUX_AARCH64"
              else
                url "https://github.com/pacharanero/sct/releases/download/v#{version}/sct-linux-x86_64.tar.gz"
                sha256 "$LINUX_X86_64"
              end
            end

            def install
              bin.install "sct"
            end

            test do
              assert_match "sct #{version}", shell_output("#{bin}/sct --version")
            end
          end
          EOF

          git -c user.name="sct release bot" \
              -c user.email="bot@sct.baw.medical" \
              commit -am "bump sct to v$VERSION"
          git push

      - name: Update Scoop bucket (pacharanero/scoop)
        env:
          GH_TOKEN: ${{ secrets.TAP_REPOS_TOKEN }}
          VERSION: ${{ steps.vars.outputs.version }}
          WINDOWS_X86_64: ${{ steps.sums.outputs.windows_x86_64 }}
        run: |
          set -eu
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/pacharanero/scoop.git" bucket
          cd bucket

          cat > bucket/sct.json <<EOF
          {
              "version": "$VERSION",
              "description": "Local-first SNOMED CT toolchain: RF2 to NDJSON, SQLite, Parquet, embeddings, MCP server",
              "homepage": "https://github.com/pacharanero/sct",
              "license": "AGPL-3.0-or-later",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/pacharanero/sct/releases/download/v$VERSION/sct-windows-x86_64.zip",
                      "hash": "$WINDOWS_X86_64"
                  }
              },
              "bin": "sct.exe",
              "checkver": {
                  "github": "https://github.com/pacharanero/sct"
              },
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/pacharanero/sct/releases/download/v\$version/sct-windows-x86_64.zip"
                      }
                  },
                  "hash": {
                      "url": "https://github.com/pacharanero/sct/releases/download/v\$version/SHA256SUMS",
                      "regex": "(?<sha256>[0-9a-f]{64})\\\\s+sct-windows-x86_64\\\\.zip"
                  }
              }
          }
          EOF

          git -c user.name="sct release bot" \
              -c user.email="bot@sct.baw.medical" \
              commit -am "bump sct to v$VERSION"
          git push

  publish-aur:
    name: Publish AUR package
    needs: release
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  dispatch-python-publish:
    name: Dispatch Python publication
    needs: [publish-docker, publish-ghcr, publish-crates, update-taps, publish-aur]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the trusted top-level Python publisher
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run auto-tag.yml --ref main -f tag="$TAG"
