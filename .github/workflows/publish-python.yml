name: Build Python wheels

# The top-level auto-tag.yml workflow validates and publishes these artefacts.
# Keeping the OIDC upload there ensures PyPI sees the registered workflow.

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.20.0"
        required: true
        type: string
permissions:
  contents: read

jobs:
  validate:
    name: Validate package identity and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Check tag, manifests, and package names
        env:
          TAG: ${{ inputs.tag }}
        run: |
          root_version=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
          binding_version=$(grep -m1 '^version = "' python/Cargo.toml | cut -d'"' -f2)
          binding_name=$(grep -m1 '^name = "' python/Cargo.toml | cut -d'"' -f2)
          distribution_name=$(grep -m1 '^name = "' python/pyproject.toml | cut -d'"' -f2)

          if [ "$TAG" != "v$root_version" ]; then
            echo "Tag $TAG does not match root version $root_version" >&2
            exit 1
          fi
          if [ "$binding_version" != "$root_version" ]; then
            echo "Python binding version $binding_version does not match root version $root_version" >&2
            exit 1
          fi
          if [ "$binding_name" != "sct-py" ] || [ "$distribution_name" != "sct-py" ]; then
            echo "Expected the binding crate and distribution to be named sct-py" >&2
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --locked --target ${{ matrix.target }}-unknown-linux-gnu --out dist --manifest-path Cargo.toml
          manylinux: auto
          working-directory: python
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-linux-${{ matrix.target }}
          path: python/dist

  windows:
    name: Windows x86-64
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --locked --target x86_64-pc-windows-msvc --out dist --manifest-path Cargo.toml
          working-directory: python
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-windows-x86_64
          path: python/dist

  macos:
    name: macOS ${{ matrix.target }}
    needs: validate
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --locked --target ${{ matrix.target }}-apple-darwin --out dist --manifest-path Cargo.toml
          working-directory: python
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-macos-${{ matrix.target }}
          path: python/dist
